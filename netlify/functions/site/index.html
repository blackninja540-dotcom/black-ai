
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>BLACK AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }
    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #252b38;
    }
    header h1 { letter-spacing: 4px; }
    header p { color: #9ca3af; }
    main {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }
    #chat {
      min-height: 55vh;
      padding: 15px;
      border: 1px solid #252b38;
      border-radius: 14px;
      overflow-y: auto;
    }
    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .user { background: #173b63; }
    .ai { background: #202633; }
    .input-area {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 10px;
      background: #151b27;
      color: white;
      border: 1px solid #343c4d;
      font-size: 16px;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    footer {
      text-align: center;
      color: #778094;
      padding: 18px;
    }
  </style>
</head>
<body>
  <header>
    <h1>BLACK AI</h1>
    <p>Asisten Multi AI</p>
  </header>

  <main>
    <div id="chat">
      <div class="message ai">
        Halo! Aku BLACK AI. Ada yang bisa aku bantu?
      </div>
    </div>

    <div class="input-area">
      <input id="message" placeholder="Tulis pesan...">
      <button id="send">Kirim</button>
    </div>
  </main>

  <footer>BLACK AI - Tahap pembangunan awal</footer>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;

      const reply = addMessage("BLACK AI sedang berpikir...", "ai");

      try {
        const response = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Terjadi kesalahan.");

        reply.textContent = data.answer || "Belum ada jawaban dari Gemini.";
      } catch (error) {
        reply.textContent = "Gagal menghubungi AI: " + error.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
