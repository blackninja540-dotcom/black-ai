
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101018">
  <title>BLACK AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101018;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #292936;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 3px;
    }

    header p {
      color: #9999aa;
      margin-bottom: 0;
    }

    main {
      width: 100%;
      max-width: 750px;
      margin: auto;
      padding: 20px;
      flex: 1;
    }

    #chat {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding-bottom: 20px;
    }

    .message {
      padding: 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #30304a;
      align-self: flex-end;
      max-width: 85%;
    }

    .ai {
      background: #20202c;
      align-self: flex-start;
      max-width: 95%;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #414155;
      background: #20202c;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 10px;
      background: #7655e8;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }

    footer {
      padding: 15px;
      text-align: center;
      color: #777788;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>BLACK AI</h1>
    <p>Asisten Multi AI</p>
  </header>

  <main>
    <div id="chat">
      <div class="message ai">
        Halo! Aku BLACK AI. Ada yang bisa aku bantu?
      </div>
    </div>

    <div class="input-area">
      <input
        id="message"
        type="text"
        placeholder="Tulis pesan..."
        autocomplete="off"
      >
      <button id="send">Kirim</button>
    </div>
  </main>

  <footer>
    BLACK AI - Tahap pertama
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      div.scrollIntoView({ behavior: "smooth" });
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message || send.disabled) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      send.textContent = "...";

      const loading = document.createElement("div");
      loading.className = "message ai";
      loading.textContent = "BLACK AI sedang berpikir...";
      chat.appendChild(loading);

      try {
        const response = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        loading.remove();

        if (!response.ok) {
          throw new Error(data.error || "Terjadi kesalahan.");
        }

        addMessage(data.answer || "Belum ada jawaban.", "ai");

      } catch (error) {
        loading.remove();
        addMessage("Maaf, terjadi kesalahan: " + error.message, "ai");
      }

      send.disabled = false;
      send.textContent = "Kirim";
      input.focus();
    }

    send.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
